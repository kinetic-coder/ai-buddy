name: macOS CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master, 'feature/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-tests:
    name: Build and test Swift package
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show Swift and Xcode versions
        run: |
          swift --version
          xcodebuild -version
      - name: Build (debug)
        run: swift build
      - name: Run unit tests
        run: swift test --parallel
      - name: Build Xcode app with App Sandbox configuration
        run: >-
          xcodebuild -project AIBuddy.xcodeproj -scheme AIBuddy
          -configuration Debug -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO build
      - name: Validate entitlements plist
        run: plutil -lint Config/AIBuddy.entitlements

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
