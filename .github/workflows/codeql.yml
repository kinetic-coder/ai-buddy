name: CodeQL

on:
  push:
    branches: [master, 'feature/**']
  pull_request:
    branches: [master]
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-swift:
    name: Analyze Swift
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: swift
          build-mode: manual
          queries: security-extended
      - name: Build analyzed app
        run: >-
          xcodebuild -project AIBuddy.xcodeproj -scheme AIBuddy
          -configuration Debug -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO clean build
      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4

